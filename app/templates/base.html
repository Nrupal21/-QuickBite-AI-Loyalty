<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}QuickBite AI + Loyalty{% endblock %}</title>
    <meta name="description" content="{% block description %}One QR code on your receipt — AI-drafted 5-star reviews and an app-less loyalty stamp card for your restaurant.{% endblock %}">

    <!-- Animate.css — must load in <head> so classes exist before first render (Doc 4 §7.3) -->
    <link rel="preload" as="style"
          href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

    <!-- Fonts: Inter (all UI text) + JetBrains Mono (redemption codes) per Doc 4 §3 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap">

    <!-- Tailwind CDN (dev/v1 — swap for compiled build before scale) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Doc 4 §2 palette — the 11 exact hexes, single source of truth for custom CSS */
        :root {
            --qb-blue:   #1A56DB;
            --qb-teal:   #0D9488;
            --qb-orange: #FF6B35;
            --qb-ink:    #1E2A3A;
            --qb-muted:  #64748B;
            --qb-tint:   #EFF6FF;
            --qb-green:  #059669;
            --qb-red:    #DC2626;
            --qb-amber:  #D97706;
            --qb-purple: #7C3AED;
            --qb-white:  #FFFFFF;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--qb-ink);
        }
        h1, h2, h3 { text-wrap: balance; }
        .font-mono-code { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="bg-white antialiased">
    {% block content %}{% endblock %}

    <!-- Anime.js — before </body>, before app.js (Doc 4 §7.3) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

    <!-- Page-specific libraries (Three.js/GSAP landing-only, confetti celebration-only) -->
    {% block scripts %}{% endblock %}

    <!-- App code last -->
    <script src="/static/js/app.js"></script>
    {% block page_scripts %}{% endblock %}
</body>
</html>
