<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Dashboard — QuickBite AI + Loyalty</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
<!-- Tailwind CSS (STITCH-07: generated screen ships with its own Tailwind
     config carrying the exact Doc 4 hex palette as brand-* tokens — this
     page intentionally does not extend base.html/landing.css, since it is
     an app shell with its own sidebar nav, not a marketing page.) -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                "colors": {
                    "primary-container": "#1a56db",
                    "on-primary-container": "#d4dcff",
                    "surface": "#faf8ff",
                    "surface-container-low": "#f3f3fe",
                    "surface-container": "#ededf8",
                    "surface-container-high": "#e7e7f3",
                    "surface-variant": "#e2e1ed",
                    "surface-bright": "#faf8ff",
                    "on-surface": "#191b23",
                    "on-surface-variant": "#434654",
                    "outline-variant": "#c3c5d7",
                    "brand-primary": "#1A56DB",
                    "brand-loyalty-teal": "#0D9488",
                    "brand-accent-orange": "#FF6B35",
                    "brand-success": "#059669",
                    "brand-danger": "#DC2626",
                    "brand-warning": "#D97706",
                    "brand-ink": "#1E2A3A",
                    "brand-muted": "#64748B",
                    "brand-bg": "#F8FAFC"
                },
                "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                "fontFamily": {
                    "headline": ["Inter", "sans-serif"],
                    "body": ["Inter", "sans-serif"]
                }
            }
        }
    }
</script>
<style>
    body { background-color: theme('colors.brand-bg'); color: theme('colors.brand-ink'); font-family: 'Inter', sans-serif; }
</style>
</head>
<body class="bg-brand-bg font-body min-h-screen text-brand-ink overflow-x-hidden flex">

<nav class="fixed left-0 top-0 h-screen w-[240px] bg-surface shadow-sm z-50 flex flex-col justify-between py-6">
  <div>
    <div class="px-6 mb-8">
      <h1 class="text-xl font-headline font-black text-primary-container flex items-center gap-2">
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">restaurant</span>
        QuickBite
      </h1>
      <p class="text-xs text-brand-muted mt-1 font-medium">AI + Loyalty</p>
    </div>
    <div class="flex flex-col gap-1 font-body text-sm">
      <a class="flex items-center gap-3 bg-primary-container text-on-primary-container font-bold rounded-lg px-4 py-3 mx-2" href="/dashboard" aria-current="page">
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">dashboard</span>
        Dashboard
      </a>
      <a class="flex items-center gap-3 text-on-surface-variant hover:text-primary-container px-4 py-3 mx-2 hover:bg-surface-container-high transition-colors duration-200 rounded-lg group" href="/dashboard/loyalty-analytics">
        <span class="material-symbols-outlined text-brand-muted group-hover:text-primary-container transition-colors">analytics</span>
        Loyalty Analytics
      </a>
    </div>
  </div>
  <div class="px-4">
    <div class="pt-4 border-t border-outline-variant flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-brand-primary/10 text-brand-primary flex items-center justify-center font-bold text-sm" data-user-initials aria-hidden="true">--</div>
      <div>
        <p class="text-sm font-bold text-brand-ink" data-user-role-label>Staff</p>
        <span class="inline-block px-2 py-0.5 mt-0.5 bg-surface-variant text-brand-muted text-xs font-semibold rounded-full" data-user-role-badge>&nbsp;</span>
      </div>
    </div>
  </div>
</nav>

<main class="ml-[240px] flex-1 min-h-screen">
  <header class="sticky top-0 right-0 z-40 bg-surface/80 backdrop-blur-md border-b border-outline-variant flex justify-between items-center w-full px-8 h-16">
    <h2 class="font-body font-bold text-brand-ink tracking-tight text-xl">Dashboard</h2>
    <div class="flex items-center gap-4 text-brand-primary">
      <button class="relative opacity-80 hover:opacity-100 transition-colors" aria-label="Live updates" data-ws-indicator>
        <span class="material-symbols-outlined">notifications</span>
        <span id="new-events-badge" class="hidden absolute -top-1 -right-1 w-3 h-3 rounded-full bg-brand-danger animate__animated animate__pulse animate__infinite"></span>
      </button>
    </div>
  </header>

  <div class="p-8 max-w-7xl mx-auto space-y-8">
    <div id="dashboard-error" class="hidden bg-brand-danger/10 text-brand-danger text-sm font-medium px-4 py-3 rounded-lg" role="alert"></div>

    <!-- Stats Row — 4 cards, each wired to GET /api/v1/dashboard/stats via data-stat -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
      <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-l-brand-accent-orange animate__animated animate__fadeInUp">
        <p class="text-sm font-medium text-brand-muted mb-1">Avg. Rating</p>
        <h3 class="text-3xl font-black text-brand-ink tracking-tight" data-stat="avg_rating">—</h3>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-l-brand-primary animate__animated animate__fadeInUp">
        <p class="text-sm font-medium text-brand-muted mb-1">Total Reviews</p>
        <h3 class="text-3xl font-black text-brand-ink tracking-tight" data-stat="review_count">—</h3>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-l-brand-warning animate__animated animate__fadeInUp">
        <p class="text-sm font-medium text-brand-muted mb-1">Pending Approvals</p>
        <h3 class="text-3xl font-black text-brand-ink tracking-tight" data-stat="pending_approvals">—</h3>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-l-brand-loyalty-teal animate__animated animate__fadeInUp">
        <p class="text-sm font-medium text-brand-muted mb-1">Loyalty Scans Today</p>
        <h3 class="text-3xl font-black text-brand-ink tracking-tight" data-stat="loyalty_scans_today">—</h3>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- Sentiment trend — id required for Chart.js (STITCH-07 AC) -->
      <div class="lg:col-span-2 bg-white rounded-xl shadow-sm border border-outline-variant/30 p-6 flex flex-col">
        <div class="flex justify-between items-center mb-6">
          <h3 class="text-lg font-bold text-brand-ink">Sentiment Trend (Last 7 Days)</h3>
        </div>
        <div id="sentiment-chart" class="flex-1 min-h-[250px]"></div>
      </div>

      <!-- Pending reviews: no GET /reviews?state=pending endpoint exists yet
           (REVIEW-02 only has approve/reject-by-id) — illustrative content
           until a list endpoint lands. Buttons are inert placeholders. -->
      <div class="bg-white rounded-xl shadow-sm border border-outline-variant/30 overflow-hidden flex flex-col h-[400px]">
        <div class="p-5 border-b border-outline-variant/30 flex justify-between items-center bg-surface-bright sticky top-0 z-10">
          <h3 class="text-lg font-bold text-brand-ink">Action Required</h3>
          <span class="bg-brand-warning/10 text-brand-warning text-xs font-bold px-2.5 py-1 rounded-full" data-stat-badge="pending_approvals">— Pending</span>
        </div>
        <div class="overflow-y-auto flex-1 p-0 divide-y divide-outline-variant/20" data-review-list>
          <div class="p-5 text-sm text-brand-muted">No pending reviews to show yet.</div>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="{{ url_for('static', path='js/dashboard.js') }}" defer></script>
</body>
</html>
