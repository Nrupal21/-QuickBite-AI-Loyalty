{# Shared HTML shell for every transactional email. Table-based layout with
   inline styles only — this is the one place in the app where that's
   correct, not a code smell: email clients strip <style> blocks and ignore
   flexbox/grid entirely. #}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}QuickBite AI + Loyalty{% endblock %}</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="width:480px;max-width:100%;background:#ffffff;border-radius:16px;border:1px solid #e4e4e7;">
            <tr>
              <td style="padding:32px 40px 0 40px;">
                <span style="font-weight:700;font-size:18px;color:#0b0b0d;letter-spacing:-0.01em;">QuickBite</span>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 40px 32px 40px;color:#1e2a3a;font-size:15px;line-height:1.6;">
                {% block content %}{% endblock %}
              </td>
            </tr>
            <tr>
              <td style="padding:20px 40px 28px 40px;border-top:1px solid #e4e4e7;">
                <p style="margin:0;font-size:12px;line-height:1.5;color:#64748b;">
                  You're receiving this email because of activity on your QuickBite account. If you didn't expect this, you can safely ignore it.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
