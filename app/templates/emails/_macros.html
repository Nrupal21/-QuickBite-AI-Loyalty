{# Shared CTA button, imported by any HTML template that needs one. A table
   cell with padding, not <button> or CSS border-radius shorthand tricks —
   the combination that survives the most email clients (Outlook's Word
   rendering engine in particular ignores real <button>/<a> padding). #}
{% macro cta_button(url, label) -%}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:24px 0;">
  <tr>
    <td style="background:#2563eb;border-radius:999px;">
      <a href="{{ url }}" style="display:inline-block;padding:12px 28px;font-size:14px;font-weight:600;color:#ffffff;text-decoration:none;">{{ label }}</a>
    </td>
  </tr>
</table>
{%- endmacro %}
