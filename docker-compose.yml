# QuickBite AI + Loyalty — local dev stack (DOCKER ticket)
# FastAPI (hot reload) + PostgreSQL/PostGIS + Redis + Celery worker/beat.
# Secrets come from .env (gitignored); service hosts are overridden below.

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: quickbite
      POSTGRES_PASSWORD: quickbite
      POSTGRES_DB: quickbite
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickbite -d quickbite"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file: .env
    # DATABASE_URL intentionally NOT overridden here — this stack currently
    # points DATABASE_URL/MIGRATION_DATABASE_URL at the same shared Supabase
    # instance (via .env), so the local `db` container below carries no
    # schema. See docker-compose's local `db`/`redis` services above if you
    # want a fully local, isolated stack instead: point DATABASE_URL back at
    # db:5432 and MIGRATION_DATABASE_URL at the same, then re-run migrations.
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A app.workers.celery_app worker --loglevel=info
    volumes:
      - .:/app
    env_file: .env
    # DATABASE_URL intentionally NOT overridden here — this stack currently
    # points DATABASE_URL/MIGRATION_DATABASE_URL at the same shared Supabase
    # instance (via .env), so the local `db` container below carries no
    # schema. See docker-compose's local `db`/`redis` services above if you
    # want a fully local, isolated stack instead: point DATABASE_URL back at
    # db:5432 and MIGRATION_DATABASE_URL at the same, then re-run migrations.
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  beat:
    build: .
    command: celery -A app.workers.celery_app beat --loglevel=info
    volumes:
      - .:/app
    env_file: .env
    # DATABASE_URL intentionally NOT overridden here — this stack currently
    # points DATABASE_URL/MIGRATION_DATABASE_URL at the same shared Supabase
    # instance (via .env), so the local `db` container below carries no
    # schema. See docker-compose's local `db`/`redis` services above if you
    # want a fully local, isolated stack instead: point DATABASE_URL back at
    # db:5432 and MIGRATION_DATABASE_URL at the same, then re-run migrations.
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
